[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathmgr"
version = "0.0.1"
description = "Symbolic path analysis: specify a path model, compute covariances between any two variables, draw the diagram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
render = ["matplotlib>=3.8", "networkx>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
